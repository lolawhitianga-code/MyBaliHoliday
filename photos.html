<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Photos · My Bali Holiday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1730; --ink-soft:#4A4266;
  --sand:#FFF3E2; --sand-deep:#F6E3C8; --line:#E4CDA9;
  --frangipani:#FF4D8D; --lagoon:#0BA5C7; --marigold:#FF9F1C; --pandan:#16A97C; --dusk:#9B5DE5;
  --shadow:0 2px 0 rgba(27,23,48,.10), 0 10px 26px -14px rgba(27,23,48,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sand);color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

.top{
  position:relative;overflow:hidden;text-align:center;color:#fff;
  padding:calc(26px + env(safe-area-inset-top)) 20px 30px;
  background:
    radial-gradient(120px 120px at 80% 92%, rgba(255,209,102,.5), rgba(255,159,28,0) 70%),
    linear-gradient(178deg, rgba(27,23,48,.72) 0%, rgba(75,42,99,.50) 42%, rgba(196,63,118,.42) 72%, rgba(255,122,69,.34) 100%),
    url('hero-photos.jpg') center 28% / cover no-repeat;
}
.top::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--frangipani),var(--marigold),var(--pandan),var(--lagoon),var(--dusk));
}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75;margin:0 0 6pxtext-shadow:0 1px 8px rgba(27,23,48,.6);}
.wordmark{
  font-family:'Fraunces',serif;font-weight:900;font-size:clamp(30px,8.5vw,44px);
  line-height:.95;margin:0;font-variation-settings:'SOFT' 40,'WONK' 1;
}

.mebar{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:10px 16px;background:var(--sand-deep);border-bottom:1px solid var(--line);font-size:14px;
}
.medot{width:12px;height:12px;border-radius:50%;flex:none}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}

main{max-width:780px;margin:0 auto;padding:16px 14px 40px}
h2.sec{
  font-family:'DM Mono',monospace;font-weight:500;font-size:11.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-soft);margin:26px 0 11px 2px;
}
h2.sec:first-child{margin-top:0}

/* stats strip */
.stats{display:flex;gap:10px;margin-bottom:4px}
.stat{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px 10px;text-align:center;box-shadow:var(--shadow);
}
.stat b{
  display:block;font-family:'Fraunces',serif;font-weight:900;font-size:27px;line-height:1;
  font-variation-settings:'SOFT' 40,'WONK' 1;
  text-shadow:0 2px 20px rgba(27,23,48,.55), 0 1px 3px rgba(27,23,48,.4);
}
.stat span{
  font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-top:5px;
}
.places{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.place{
  font-family:'DM Mono',monospace;font-size:11.5px;background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;
}

/* album card */
.album{
  display:block;position:relative;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:13px;
  min-height:132px;background:var(--fallback);
  transition:transform .14s ease;
}
.album:hover{transform:translateY(-2px)}
.album.big{min-height:190px}
.album .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.album .veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(27,23,48,.12) 0%, rgba(27,23,48,.28) 45%, rgba(27,23,48,.82) 100%);
}
.album .inner{position:relative;padding:15px;display:flex;flex-direction:column;justify-content:flex-end;min-height:inherit;color:#fff}
.album.big .inner{min-height:190px}
.album:not(.big) .inner{min-height:132px}
.album .yr{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;opacity:.85;
}
.album .ttl{
  font-family:'Fraunces',serif;font-weight:900;font-size:26px;line-height:1.02;margin-top:2px;
  font-variation-settings:'SOFT' 40,'WONK' 1;text-shadow:0 1px 12px rgba(0,0,0,.35);
}
.album.big .ttl{font-size:34px}
.album .when{font-family:'DM Mono',monospace;font-size:11.5px;opacity:.85;margin-top:3px}
.album .crew{display:flex;gap:4px;margin-top:9px}
.album .crew i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.album .go{
  position:absolute;top:12px;right:12px;
  background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;
  padding:4px 11px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
}
.album .go.none{background:rgba(255,255,255,.28);color:#fff}
.album .pencil{
  position:absolute;bottom:12px;right:12px;background:rgba(255,255,255,.9);color:var(--ink);
  border:0;border-radius:999px;padding:5px 12px;font-size:12px;
}
.grid2{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:620px){ .grid2{grid-template-columns:1fr 1fr;gap:13px} .grid2 .album{margin-bottom:0} }

.howto{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;
  font-size:14px;line-height:1.5;box-shadow:var(--shadow);
}
.howto b{display:block;font-family:'Fraunces',serif;font-size:17px;margin-bottom:6px}
.howto ol{margin:9px 0 0;padding-left:19px}
.howto li{margin-bottom:5px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--ink-soft);font-size:14.5px}
.addbtn{
  width:100%;margin-top:12px;border:1px solid var(--ink);background:var(--ink);color:var(--sand);
  border-radius:12px;padding:13px;font-size:15px;font-weight:500;
}

/* the wall — everything, scattered on a table */
.blurb{font-size:13px;color:var(--ink-soft);margin:0 0 12px 2px;line-height:1.4}
.wall{columns:2;column-gap:11px}
@media (min-width:620px){ .wall{columns:3} }
.wall figure{
  break-inside:avoid;margin:0 0 11px;padding:7px;background:#fff;
  border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);
  transform:rotate(var(--r,0deg));transition:transform .18s ease, box-shadow .18s ease;
  cursor:zoom-in;display:block;width:100%;
}
.wall figure:hover,.wall figure:focus-visible{
  transform:rotate(0deg) translateY(-3px) scale(1.015);
  box-shadow:0 3px 0 rgba(27,23,48,.10), 0 16px 34px -12px rgba(27,23,48,.5);
}
.wall img{width:100%;display:block;border-radius:3px}

/* lightbox */
.lb{
  position:fixed;inset:0;z-index:80;background:rgba(20,16,36,.95);
  display:none;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:82vh;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.lb .x,.lb .p,.lb .n{
  position:absolute;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  color:#fff;border-radius:999px;width:44px;height:44px;font-size:20px;line-height:1;
  backdrop-filter:blur(6px);
}
.lb .x{top:calc(14px + env(safe-area-inset-top));right:14px}
.lb .p{left:12px;top:50%;transform:translateY(-50%)}
.lb .n{right:12px;top:50%;transform:translateY(-50%)}
.lb .count{
  position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.7);
}

.wallhead{display:flex;align-items:center;gap:10px;margin:26px 0 4px 2px}
.wallhead h2{margin:0}
.upbtn{
  margin-left:auto;border:1px solid var(--ink);background:var(--ink);color:var(--sand);
  border-radius:999px;padding:7px 15px;font-size:13px;font-weight:500;flex:none;
}
.upbtn[disabled]{opacity:.55}
.upstat{
  font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-soft);
  margin:0 0 11px 2px;min-height:17px;
}
.wall figure.mine::after{
  content:'';position:absolute;top:11px;right:11px;width:10px;height:10px;border-radius:50%;
  background:var(--who);box-shadow:0 0 0 2px #fff;
}
.lb .del{
  position:absolute;bottom:calc(52px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,77,141,.6);color:#FF9BC0;
  border-radius:999px;padding:7px 16px;font-size:13px;backdrop-filter:blur(6px);
}
.lb .del.hide{display:none}

.buildstamp{
  text-align:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:var(--ink-soft);opacity:.45;margin:26px 0 0;
}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,243,226,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav a{
  flex:1;text-align:center;padding:8px 2px 9px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);
}
.nav b{display:block;font-size:18px;font-weight:400;line-height:1.3;margin-bottom:2px}
.nav [aria-current="page"]{color:var(--ink);font-weight:500}

.scrim{
  position:fixed;inset:0;background:rgba(27,23,48,.55);z-index:70;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  background:var(--sand);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(14px);transition:transform .2s ease;
}
.scrim.on .sheet{transform:none}
.sheet h3{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin:0 0 3px}
.sheet .sub{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin:0 0 14px}
label{display:block;font-size:12px;font-weight:500;letter-spacing:.04em;margin:12px 0 5px}
input,textarea{
  width:100%;font:inherit;font-size:16px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip{font-family:'DM Mono',monospace;font-size:11px;opacity:.6;margin:6px 0 0;line-height:1.5}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.picks button{
  border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px 7px 9px;
  display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;
}
.picks button i{width:14px;height:14px;border-radius:50%;display:block}
.picks button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sand)}
.seg{display:flex;gap:8px;margin-top:5px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.namegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px;margin-top:6px}
.namegrid button{
  padding:13px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;
  font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.namegrid button i{width:18px;height:18px;border-radius:50%;display:block}
.sheetfoot{display:flex;gap:9px;margin-top:20px;padding-bottom:4px}
.sheetfoot .btn{flex:1;border:1px solid var(--ink);background:var(--ink);color:var(--sand);border-radius:10px;padding:11px;font-weight:500}
.sheetfoot .btn.ghost{background:transparent;color:var(--ink)}
.sheetfoot .btn.danger{background:transparent;border-color:var(--frangipani);color:var(--frangipani)}

.banner{margin:12px 14px 0;padding:10px 13px;border-radius:11px;font-size:13px;background:#FFF0C2;border:1px solid #E8C766}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);
  background:var(--ink);color:var(--sand);padding:11px 18px;border-radius:999px;
  font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:all .2s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none !important}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>

<script type="module">
/* ============================================================
   Celebration — deliberately inline. Nothing has to download
   first, so it cannot fail because a file was missed or cached.
   The leaderboard write is the only part that's fetched, and
   that one is allowed to be late.
   ============================================================ */
const BUILD = "v75";
const STAR = {
  alldone:[50,"That's the lot","nothing left on your list"],
  visa:   [25,"Admin done","one less thing"],
  flight: [15,"Flight added","we know when you land"],
  stay:   [15,"Beds sorted","nice one"],
  shoplog:[15,"Shop logged","and squared up"],
  planner:[10,"On the plan","the trip takes shape"],
  idea:   [10,"Good idea","let's see what they think"],
  expense:[10,"Expense in","nobody's out of pocket"],
  photo:  [10,"Photo up","on the wall"],
  packing:[5,"You're bringing it","so nobody else does"],
  packed: [5,"In the bag",""],
  shopping:[5,"On the list",""],
  vote:   [5,"Voted",""],
  trolley:[3,"In the trolley",""]
};

let _ac = null;
function _actx(){
  if(localStorage.getItem("mbh_muted") === "1") return null;
  try{
    if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if(_ac.state === "suspended") _ac.resume();
    return _ac;
  }catch(e){ return null; }
}
addEventListener("pointerdown", function u(){
  const c = _actx();
  if(c && c.state === "running") removeEventListener("pointerdown", u, true);
}, true);

function _note(c,f,at,dur,vol,type){
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"triangle"; o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(vol,at+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(c.destination);
  o.start(at); o.stop(at+dur+0.05);
}
function _sound(pts){
  const c=_actx(); if(!c) return;
  const t=c.currentTime+0.02, big=pts>=15;
  const ns = big ? [523.25,659.25,783.99,1046.5,1318.51] : [523.25,659.25,783.99,1046.5];
  ns.forEach((f,i)=>{ _note(c,f,t+i*0.075,0.42,0.16,"triangle"); _note(c,f*2,t+i*0.075,0.2,0.05,"sine"); });
  const tail=t+ns.length*0.075;
  for(let i=0;i<(big?7:4);i++) _note(c,1600+Math.random()*1600,tail+i*0.045,0.16,0.035,"sine");
  if(big) _note(c,130.81,t,0.9,0.1,"sine");
}

function _css(){
  if(document.getElementById("mbh-star-css")) return;
  const s=document.createElement("style"); s.id="mbh-star-css";
  s.textContent=`#mbh-stars{position:fixed;inset:0;z-index:99998;pointer-events:none;overflow:hidden}
#mbh-stars b{position:absolute;top:-8vh;display:block;line-height:1;color:#FFD166;
 text-shadow:0 0 14px rgba(255,193,71,.9),0 2px 5px rgba(120,70,0,.45);will-change:transform,opacity;
 animation:mbh-fall var(--dur) cubic-bezier(.35,.1,.6,1) var(--delay) both}
@keyframes mbh-fall{0%{transform:translate3d(0,0,0) rotate(0) scale(.7);opacity:0}
 10%{opacity:1;transform:translate3d(0,10vh,0) rotate(60deg) scale(1)}
 100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot)) scale(1);opacity:0}}
#mbh-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:99999;
 pointer-events:none;text-align:center;animation:mbh-pop 2.1s cubic-bezier(.2,1.3,.4,1) both}
#mbh-pop .n{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(54px,17vw,92px);
 line-height:.9;color:#FFD166;text-shadow:0 0 34px rgba(255,193,71,.75),0 4px 14px rgba(60,32,0,.5);display:block}
#mbh-pop .l{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:19px;color:#fff;
 text-shadow:0 2px 12px rgba(27,23,48,.85);margin-top:4px;display:block}
#mbh-pop .s{font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.16em;
 text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 2px 10px rgba(27,23,48,.85);margin-top:6px;display:block}
@keyframes mbh-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
 14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}24%{transform:translate(-50%,-50%) scale(1)}
 74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#mbh-stars b{animation-duration:.9s}}`;
  document.head.appendChild(s);
}

function celebrate(kind, opts){
  const a = STAR[kind];
  if(!a) return;
  const [pts,label,note] = a;
  _css();

  const old = document.getElementById("mbh-pop"); if(old) old.remove();
  const p = document.createElement("div"); p.id = "mbh-pop";
  p.innerHTML = `<span class="n">+${pts}</span><span class="l">${label}</span>` +
                (note ? `<span class="s">${note}</span>` : "");
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 2200);

  const wrap = document.createElement("div"); wrap.id = "mbh-stars";
  const n = Math.min(64, 16 + pts * 1.6);
  const gl = ["\u2605","\u2605","\u2605","\u2726","\u2b50"];
  let h = "";
  for(let i=0;i<n;i++){

async function makeStore(){
  if(!FIREBASE.projectId) return localStore();
  try{
    const [{ initializeApp }, fs, fa] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
    const app = initializeApp(FIREBASE);
    try{ await withTimeout(fa.signInAnonymously(fa.getAuth(app)), 8000); }catch(e){ /* open rules */ }
    const db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    const col = fs.collection(db, "trips");
    const wallCol = fs.collection(db, "wall");
    return {
      kind:"cloud",
      subscribe(cb, onWall){
        fs.onSnapshot(col,
          snap => cb(snap.docs.map(d=>({ id:d.id, ...d.data() }))),
          err  => banner("Can't reach the albums right now — " + (err.code || err.message))
        );
        fs.onSnapshot(wallCol,
          snap => onWall(snap.docs.map(d=>({ id:d.id, ...d.data() }))),
          err  => banner("Can't reach the wall right now — " + (err.code || err.message))
        );
      },
      add:    v => withTimeout(fs.addDoc(col, { ...v, createdAt: Date.now() })),
      update: (id,v) => withTimeout(fs.updateDoc(fs.doc(db,"trips",id), v)),
      remove: id => withTimeout(fs.deleteDoc(fs.doc(db,"trips",id))),
      addWall:    v  => withTimeout(fs.addDoc(wallCol, { ...v, createdAt: Date.now() }), 20000),
      removeWall: id => withTimeout(fs.deleteDoc(fs.doc(db,"wall",id)))
    };
  }catch(e){
    banner("Couldn't reach the shared albums, so this is saving on your device only.");
    return localStore();
  }
}

function localStore(){
  const KEY = "mbh_trips_v1";
  const read = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const write = v => localStorage.setItem(KEY, JSON.stringify(v));
  const WKEY = "mbh_wall_v1";
  const wread = () => JSON.parse(localStorage.getItem(WKEY) || "[]");
  const wwrite = v => localStorage.setItem(WKEY, JSON.stringify(v));
  let cb = ()=>{}, wcb = ()=>{};
  const push = () => { cb(read()); wcb(wread()); };
  return {
    kind:"local",
    subscribe(fn, wfn){ cb = fn; wcb = wfn || (()=>{}); push(); },
    addWall(v){
      const d = wread();
      if(d.length >= 6) throw new Error("Test mode only holds a few — go live to add more");
      d.push({ ...v, id:"w"+Date.now()+Math.random().toString(36).slice(2,6), createdAt:Date.now() });
      wwrite(d); push();
    },
    removeWall(id){ wwrite(wread().filter(x=>x.id!==id)); push(); },
    add(v){ const d = read(); d.push({ ...v, id:"t"+Date.now()+Math.random().toString(36).slice(2,6), createdAt:Date.now() }); write(d); push(); },
    update(id,v){ const d = read(); const i = d.find(x=>x.id===id); if(i) Object.assign(i,v); write(d); push(); },
    remove(id){ write(read().filter(x=>x.id!==id)); push(); }
  };
}

function albumHtml(t, i, big){
  const fb = FALLBACKS[i % FALLBACKS.length];

  const tag = t.album
    ? `<span class="go">Open album →</span>`
    : `<span class="go none">No album yet</span>`;
  const inner = `
    ${t.cover ? `<img class="cover" src="${esc(t.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
    <span class="veil"></span>
    <span class="inner">
      <span class="yr">${esc(t.year || "")}</span>
      <span class="ttl">${esc(t.place || "Somewhere")}</span>
      ${t.when ? `<span class="when">${esc(t.when)}</span>` : ""}
      ${crew ? `<span class="crew">${crew}</span>` : ""}
    </span>
    ${tag}`;

  const cls = `album${big ? " big" : ""}`;
  return t.album
    ? `<a class="${cls}" style="--fallback:${fb}" href="${esc(t.album)}" target="_blank" rel="noopener">
         ${inner}<button class="pencil" data-edit="${t.id}">Edit</button></a>`
    : `<div class="${cls}" style="--fallback:${fb}">

}

document.addEventListener("click", async e => {
  const hit = s => e.target.closest(s);

  const ed = hit("[data-edit]");
  if(ed){
    e.preventDefault();
    const t = trips.find(x=>x.id===ed.dataset.edit);
    if(t) tripSheet(t);
    return;
  }

  const mePick = hit("[data-me]");
  if(mePick){ me = mePick.dataset.me; localStorage.setItem("mbh_me", me); closeSheet(); render(); return; }

  const pick = hit("[data-pick]");
  if(pick){
    const n = pick.dataset.pick;
    const on = pick.getAttribute("aria-pressed") === "true";
    pick.setAttribute("aria-pressed", !on);
    picked = on ? picked.filter(x=>x!==n) : [...picked, n];
    return;
  }

  const cur = hit("[data-cur]");
  if(cur){
    isCurrent = cur.dataset.cur === "yes";
    $("tCur").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===cur));
    return;
  }

  const rm = hit("[data-remove]");
  if(rm){
    try{ await store.remove(rm.dataset.remove); closeSheet(); toast("Removed"); }
    catch(err){ toast(err.message); }
    return;
  }

  if(hit("[data-save]")){
    const place = $("tPlace").value.trim();
    if(!place){ toast("Where was it?"); $("tPlace").focus(); return; }
    const v = {
      place,
      year:  $("tYear").value.trim(),
      when:  $("tWhen").value.trim(),
      album: $("tAlbum").value.trim(),
      cover: $("tCover").value.trim(),
      who:   picked,
      current: isCurrent,
      addedBy: me
    };
    try{
      // only one trip can be the current one
      if(isCurrent){
        for(const other of trips){
          if(other.current && other.id !== editing) await store.update(other.id, { current:false });
        }
      }
      if(editing) await store.update(editing, v); else await store.add(v);
      closeSheet(); toast("Saved");
    }catch(err){ toast(err.message); }
    return;
  }

  if(hit("[data-close]") || e.target.id === "scrim"){ closeSheet(); return; }
  if(e.target.id === "btnSwitch"){ pickName(false); return; }
  if(e.target.id === "btnAdd"){ if(!me) return pickName(true); tripSheet(null); return; }
});

/* ---------- shrink it in the browser before it goes anywhere ----------
   Firestore caps a document at 1MB and base64 inflates by about a third,
   so we aim for roughly 200KB of actual JPEG. */
const BUDGET = 200 * 1024;

async function bitmapOf(file){
  try{
    return await createImageBitmap(file, { imageOrientation: "from-image" });
  }catch(e){
    const url = URL.createObjectURL(file);
    try{
      return await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => rej(new Error("Couldn't read that image"));
        im.src = url;
      });
    } finally { setTimeout(()=>URL.revokeObjectURL(url), 5000); }
  }
}

async function shrink(file){
  const bmp = await bitmapOf(file);
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");

  const draw = side => {
    const s = Math.min(1, side / Math.max(bmp.width, bmp.height));
    c.width  = Math.max(1, Math.round(bmp.width  * s));
    c.height = Math.max(1, Math.round(bmp.height * s));
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
  };

  let side = 1400;
  draw(side);
  let q = 0.82;
  let out = c.toDataURL("image/jpeg", q);

  // first drop quality, then drop resolution — quality is cheaper to lose
  while(out.length > BUDGET * 1.37 && q > 0.42){
    q -= 0.08;
    out = c.toDataURL("image/jpeg", q);
  }
  while(out.length > BUDGET * 1.37 && side > 700){
    side = Math.round(side * 0.8);
    draw(side);
    out = c.toDataURL("image/jpeg", 0.72);
  }
  if(bmp.close) bmp.close();

  if(out.length > 900 * 1024) throw new Error("That one won't shrink far enough — try a smaller photo");
  return { data: out, w: c.width, h: c.height, bytes: Math.round(out.length / 1.37) };
}

async function handleFiles(files){
  const list = [...files].filter(f => f.type.startsWith("image/"));
  if(!list.length) return;
  if(!me){ pickName(true); return; }

  $("btnUp").disabled = true;
  let ok = 0, failed = 0;

  for(let i = 0; i < list.length; i++){
    $("upStat").textContent = `Shrinking ${i+1} of ${list.length}…`;
    try{
      const img = await shrink(list[i]);
      $("upStat").textContent = `Uploading ${i+1} of ${list.length}… (${Math.round(img.bytes/1024)} KB)`;
      await store.addWall({ data: img.data, w: img.w, h: img.h, who: me });
      ok++;
      if(ok === 1) celebrate("photo");
    }catch(err){
      failed++;
      $("upStat").textContent = err.message;
      await new Promise(r=>setTimeout(r, 1400));
    }
  }

  $("btnUp").disabled = false;
  $("upStat").textContent = failed
    ? `${ok} added, ${failed} wouldn't go up.`
    : `${ok} photo${ok===1?"":"s"} added.`;
  setTimeout(()=>{
    if($("upStat").textContent.includes("added"))
      $("upStat").textContent = "Everything we've dug out so far. Tap any of them.";
  }, 4000);
}

function paintWall(){
  const mine = uploaded
    .slice()
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .map(u => ({ src:u.data, alt:"Added by " + (u.who||"someone"), id:u.id, who:u.who }));

  shots = [...mine, ...BUILTIN];

  $("wall").innerHTML = shots.map((s,i)=>{
    const r = ((i * 37) % 5 - 2) * 0.6;       // -1.2deg .. 1.2deg
    const c = s.who ? traveller(s.who).colour : "";
    return `<figure style="--r:${r}deg${c ? `;--who:${c}` : ""}" class="${s.who ? "mine" : ""}"
                    data-open="${i}" tabindex="0">
      <img src="${s.src}" alt="${esc(s.alt)}" loading="lazy">
    </figure>`;
  }).join("");
}

function lbShow(i){
  if(!shots.length) return;
  lbAt = (i + shots.length) % shots.length;
  const s = shots[lbAt];
  $("lbImg").src = s.src;
  $("lbImg").alt = s.alt;
  $("lbCount").textContent = `${lbAt+1} / ${shots.length}`;
  $("lbDel").classList.toggle("hide", !s.id);
  $("lb").classList.add("on");
}
function lbHide(){ $("lb").classList.remove("on"); }

document.addEventListener("click", async e => {
  const open = e.target.closest("[data-open]");
  if(open){ lbShow(+open.dataset.open); return; }
  if(e.target.id === "lbN"){ lbShow(lbAt + 1); return; }
  if(e.target.id === "lbP"){ lbShow(lbAt - 1); return; }
  if(e.target.id === "lbX" || e.target.id === "lb"){ lbHide(); return; }
  if(e.target.id === "btnUp"){ if(!me) return pickName(true); $("fileIn").click(); return; }
  if(e.target.id === "lbDel"){
    const s = shots[lbAt];
    if(!s || !s.id) return;
    try{ await store.removeWall(s.id); lbHide(); toast("Gone"); }
    catch(err){ toast(err.message); }
    return;
  }
});

$("fileIn").addEventListener("change", async e => {
  await handleFiles(e.target.files);
  e.target.value = "";
});

document.addEventListener("keydown", e => {
  if($("lb").classList.contains("on")){
    if(e.key === "Escape") lbHide();
    if(e.key === "ArrowRight") lbShow(lbAt + 1);
    if(e.key === "ArrowLeft")  lbShow(lbAt - 1);
    return;
  }
  const f = e.target.closest("[data-open]");
  if(f && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); lbShow(+f.dataset.open); }
});

paintWall();

/* ---------- go ---------- */
(async function start(){
  store = await makeStore();
  if(store.kind === "local" && !FIREBASE.projectId) banner("Test mode — saving on this device only.");
  store.subscribe(
    list => { trips = list; render(); },
    wall => { uploaded = wall; paintWall(); }
  );
  render();
  if(!me) pickName(true);
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
