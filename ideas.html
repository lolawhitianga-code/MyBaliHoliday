<style>
:root{
  --ink:#1B1730; --ink-soft:#4A4266;
  --sand:#FFF3E2; --sand-deep:#F6E3C8; --line:#E4CDA9;
  --frangipani:#FF4D8D; --lagoon:#0BA5C7; --marigold:#FF9F1C; --pandan:#16A97C; --dusk:#9B5DE5;
  --shadow:0 2px 0 rgba(27,23,48,.10), 0 10px 26px -14px rgba(27,23,48,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sand);color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

.top{
  position:relative;overflow:hidden;text-align:center;color:#fff;
  padding:calc(26px + env(safe-area-inset-top)) 20px 30px;
  background:
    radial-gradient(120px 120px at 80% 92%, rgba(255,209,102,.5), rgba(255,159,28,0) 70%),
    linear-gradient(178deg, rgba(27,23,48,.72) 0%, rgba(75,42,99,.50) 42%, rgba(196,63,118,.42) 72%, rgba(255,122,69,.34) 100%),
    url('hero-ideas.jpg') center 32% / cover no-repeat;
}
.top::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--frangipani),var(--marigold),var(--pandan),var(--lagoon),var(--dusk));
}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75;margin:0 0 6pxtext-shadow:0 1px 8px rgba(27,23,48,.6);}
.wordmark{
  font-family:'Fraunces',serif;font-weight:900;font-size:clamp(30px,8.5vw,44px);
  line-height:.95;margin:0;font-variation-settings:'SOFT' 40,'WONK' 1;
}
.sum{margin:13px 0 0;font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.06em;opacity:.9}

.mebar{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:10px 16px;background:var(--sand-deep);border-bottom:1px solid var(--line);font-size:14px;
}
.medot{width:12px;height:12px;border-radius:50%;flex:none}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}

main{max-width:780px;margin:0 auto;padding:16px 14px 40px}
h2.sec{
  font-family:'DM Mono',monospace;font-weight:500;font-size:11.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-soft);margin:26px 0 11px 2px;
}
h2.sec:first-child{margin-top:0}

/* idea card */
.idea{
  display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);
}
.idea.done{opacity:1}
.vote{
  flex:none;width:52px;border:1px solid var(--line);background:var(--sand);border-radius:11px;
  padding:7px 4px;text-align:center;line-height:1.1;
  transition:transform .12s ease;
}
.vote:hover{transform:translateY(-2px)}
.vote b{display:block;font-family:'DM Mono',monospace;font-size:17px;font-weight:500}
.vote span{font-size:15px;display:block;margin-bottom:1px}
.vote[aria-pressed="true"]{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.body{flex:1;min-width:0}
.ttl{font-weight:600;font-size:16px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{
  font-family:'DM Mono',monospace;font-size:11px;background:var(--sand);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;
}
.tag.on{background:var(--pandan);color:#fff;border-color:var(--pandan)}
.note{font-size:13.5px;opacity:.75;margin-top:6px;line-height:1.4}
.voters{display:flex;gap:4px;margin-top:8px;align-items:center}
.voters i{width:9px;height:9px;border-radius:50%;display:block}
.voters em{font-family:'DM Mono',monospace;font-size:10.5px;font-style:normal;opacity:.5;margin-left:3px}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.mini{

.mini:hover{background:var(--ink);color:var(--sand);border-color:var(--ink)}

.blurb{font-size:13px;color:var(--ink-soft);margin:0 0 11px 2px;line-height:1.4}
.cat{

  font-family:'Fraunces',serif;font-weight:700;font-size:17px;
}
.cat summary::-webkit-details-marker{display:none}
.cat summary::after{content:'\25BE';margin-left:auto;opacity:.4;font-size:12px;align-self:center}
.cat[open] summary::after{content:'\25B4'}
.cat summary:hover{background:var(--sand)}
.cn{font-family:'DM Mono',monospace;font-size:11px;opacity:.45;font-weight:400}
.catbody{padding:0 15px 14px}
.blurb{font-size:13px;color:var(--ink-soft);margin:0 0 11px;line-height:1.5}

.peekstrip::-webkit-scrollbar{display:none}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px;margin-top:5px}

.namegrid button i{width:18px;height:18px;border-radius:50%;display:block}
.sheetfoot{display:flex;gap:9px;margin-top:20px;padding-bottom:4px}
.sheetfoot .btn{flex:1;border:1px solid var(--ink);background:var(--ink);color:var(--sand);border-radius:10px;padding:11px;font-weight:500}
.sheetfoot .btn.ghost{background:transparent;color:var(--ink)}

.banner{margin:12px 14px 0;padding:10px 13px;border-radius:11px;font-size:13px;background:#FFF0C2;border:1px solid #E8C766}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);

  font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:all .2s ease;

.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none !important}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

<script type="module">
/* ============================================================
   Celebration — deliberately inline. Nothing has to download
   first, so it cannot fail because a file was missed or cached.
   The leaderboard write is the only part that's fetched, and
   that one is allowed to be late.
   ============================================================ */
const BUILD = "v75";
const STAR = {
  alldone:[50,"That's the lot","nothing left on your list"],
  visa:   [25,"Admin done","one less thing"],
  flight: [15,"Flight added","we know when you land"],
  stay:   [15,"Beds sorted","nice one"],
  shoplog:[15,"Shop logged","and squared up"],
  planner:[10,"On the plan","the trip takes shape"],
  idea:   [10,"Good idea","let's see what they think"],
  expense:[10,"Expense in","nobody's out of pocket"],
  photo:  [10,"Photo up","on the wall"],
  packing:[5,"You're bringing it","so nobody else does"],
  packed: [5,"In the bag",""],
  shopping:[5,"On the list",""],
  vote:   [5,"Voted",""],
  trolley:[3,"In the trolley",""]
};

let _ac = null;
function _actx(){
  if(localStorage.getItem("mbh_muted") === "1") return null;
  try{
    if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if(_ac.state === "suspended") _ac.resume();
    return _ac;
  }catch(e){ return null; }
}
addEventListener("pointerdown", function u(){
  const c = _actx();
  if(c && c.state === "running") removeEventListener("pointerdown", u, true);
}, true);

function _note(c,f,at,dur,vol,type){
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"triangle"; o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(vol,at+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(c.destination);
  o.start(at); o.stop(at+dur+0.05);
}
function _sound(pts){
  const c=_actx(); if(!c) return;
  const t=c.currentTime+0.02, big=pts>=15;
  const ns = big ? [523.25,659.25,783.99,1046.5,1318.51] : [523.25,659.25,783.99,1046.5];
  ns.forEach((f,i)=>{ _note(c,f,t+i*0.075,0.42,0.16,"triangle"); _note(c,f*2,t+i*0.075,0.2,0.05,"sine"); });
  const tail=t+ns.length*0.075;
  for(let i=0;i<(big?7:4);i++) _note(c,1600+Math.random()*1600,tail+i*0.045,0.16,0.035,"sine");
  if(big) _note(c,130.81,t,0.9,0.1,"sine");
}

function _css(){
  if(document.getElementById("mbh-star-css")) return;
  const s=document.createElement("style"); s.id="mbh-star-css";
  s.textContent=`#mbh-stars{position:fixed;inset:0;z-index:99998;pointer-events:none;overflow:hidden}
#mbh-stars b{position:absolute;top:-8vh;display:block;line-height:1;color:#FFD166;
 text-shadow:0 0 14px rgba(255,193,71,.9),0 2px 5px rgba(120,70,0,.45);will-change:transform,opacity;
 animation:mbh-fall var(--dur) cubic-bezier(.35,.1,.6,1) var(--delay) both}
@keyframes mbh-fall{0%{transform:translate3d(0,0,0) rotate(0) scale(.7);opacity:0}
 10%{opacity:1;transform:translate3d(0,10vh,0) rotate(60deg) scale(1)}
 100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot)) scale(1);opacity:0}}
#mbh-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:99999;
 pointer-events:none;text-align:center;animation:mbh-pop 2.1s cubic-bezier(.2,1.3,.4,1) both}
#mbh-pop .n{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(54px,17vw,92px);
 line-height:.9;color:#FFD166;text-shadow:0 0 34px rgba(255,193,71,.75),0 4px 14px rgba(60,32,0,.5);display:block}
#mbh-pop .l{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:19px;color:#fff;
 text-shadow:0 2px 12px rgba(27,23,48,.85);margin-top:4px;display:block}
#mbh-pop .s{font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.16em;
 text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 2px 10px rgba(27,23,48,.85);margin-top:6px;display:block}
@keyframes mbh-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
 14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}24%{transform:translate(-50%,-50%) scale(1)}
 74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#mbh-stars b{animation-duration:.9s}}`;
  document.head.appendChild(s);
}

function celebrate(kind, opts){
  const a = STAR[kind];
  if(!a) return;
  const [pts,label,note] = a;
  _css();

  const old = document.getElementById("mbh-pop"); if(old) old.remove();
  const p = document.createElement("div"); p.id = "mbh-pop";
  p.innerHTML = `<span class="n">+${pts}</span><span class="l">${label}</span>` +
                (note ? `<span class="s">${note}</span>` : "");
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 2200);

  const wrap = document.createElement("div"); wrap.id = "mbh-stars";
  const n = Math.min(64, 16 + pts * 1.6);
  const gl = ["\u2605","\u2605","\u2605","\u2726","\u2b50"];
  let h = "";
  for(let i=0;i<n;i++){
    h += `<b style="left:${Math.random()*100}%;font-size:${13+Math.random()*26}px;
      --dur:${1.5+Math.random()*1.6}s;--delay:${Math.random()*0.7}s;
      --dx:${(Math.random()*2-1)*22}vw;--rot:${(Math.random()*2-1)*720}deg;
      opacity:${0.65+Math.random()*0.35}">${gl[i%gl.length]}</b>`;
  }
  wrap.innerHTML = h;
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 4200);

  _sound(pts);

  const who = (opts && opts.who) || localStorage.getItem("mbh_me");
  if(who) import("./stars.js").then(m => m.score && m.score(who, kind, pts)).catch(()=>{});
}

const LOCAL = [
  { key:"eat", title:"Places to eat", blurb:"Seminyak, near the villa.", map:"restaurants",
    items:[
      { title:"Ku De Ta",           where:"Jl. Kayu Aya, Seminyak",   note:"The original beach club, going since 2000. Sunset drinks rather than a cheap dinner — a bottle of rosé runs over a million." },

      { title:"Sunset Beach Bali",  where:"Jl. Sarinande, Seminyak",  note:"Beanbags on the sand, happy hour, far less of a scene than the big clubs." },
      { title:"Warung Nia",         where:"Jl. Kayu Aya, Seminyak",   note:"Balinese food and pork ribs. Huge portions, honest prices." },
      { title:"Waroeng Bernadette", where:"Jl. Kayu Aya, Seminyak",   note:"Go for the beef rendang. Unfussy room, very good food." },
      { title:"Made's Warung",      where:"Jl. Raya Seminyak",        note:"Been there decades. Nasi campur, satay, babi guling, Balinese dance some nights." },
      { title:"Warung Big Boss",    where:"Seminyak",                 note:"Tucked away and cheap. Nasi goreng kampung and Bintang for a third of beach club prices." },
      { title:"Saltlick",           where:"Jl. Kayu Aya, Seminyak",   note:"Steak, opens 5pm. Dry-aged, bone marrow, the works. Bring your wallet." },
      { title:"Zia Tina",           where:"Jl. Petitenget, Seminyak", note:"Italian, and they'll sing at you if it's someone's birthday." },
      { title:"Kilo Kitchen",       where:"Jl. Drupadi, Seminyak",    note:"Asian fusion, smart room. Beef tongue tacos and squid ink rice." },
      { title:"Yellowstone Ranch",  where:"Jl. Plawa, Seminyak",      note:"Bar and grill with a mechanical bull and a pool table. Daft, and good fun." }

  { key:"silver", title:"Silver and silversmithing", blurb:"Shops nearby, and workshops where you make your own.", map:"silver+jewellery",
    items:[
      { title:"Seminyak Silver Class",   where:"Jl. Drupadi 88a, Seminyak", note:"Make your own ring in about 90 minutes, ten minutes from the villa. Book by WhatsApp. The closest hands-on option by a long way." },
      { title:"Argentum 47 Silver Factory", where:"Jl. Camplung Tanduk, Seminyak", note:"Made on the premises, fixed prices, open till 10pm. Ask before photographing anything." },
      { title:"Bambu Silver",            where:"Jl. Raya Seminyak 28",     note:"Proper 925 silver and they'll make a custom piece from a drawing you send on WhatsApp." },
      { title:"Sae Design",              where:"Jl. Plawa, Seminyak",      note:"Handmade silver and brass, designs change weekly. Closed Sundays, shuts at 5 on Saturdays." },
      { title:"Tulola Designs",          where:"Jl. Raya Seminyak",        note:"Smarter end — gold plated over silver, Indonesian motifs. A year's warranty on tarnishing." },
      { title:"Celuk Bali Silver Class", where:"Jl. Raya Celuk, Gianyar",  note:"Celuk is the silversmithing village — about an hour's drive. One-on-one classes, pick a design or bring your own." },
      { title:"SUNSRI House of Jewelry", where:"Jl. Raya Celuk, Gianyar",  note:"Half and full day workshops in Celuk. Welcome drink, local snacks, paired with a working silversmith." }

  { key:"cook", title:"Cooking classes", blurb:"Most start with a trip to the local market.", map:"cooking+class",
    items:[
      { title:"Nia Bali Cooking Class",  where:"Jl. Kayu Aya 22, Seminyak", note:"Market tour first, then twelve dishes, then you eat the lot. Recipe book to take home. Same people as Warung Nia." },
      { title:"Rendang Bali Cooking Class", where:"Jl. Petitenget, Seminyak", note:"Market visit then a proper run at beef rendang, plus starters and dessert." },
      { title:"Cooking Class at The Amala", where:"Jl. Kunti I, Seminyak",  note:"Includes pickup. Gentler format — the chef does a good share of it, so it's more watching than chopping." },
      { title:"Kin Vegan Cooking Class", where:"Jl. Kayu Aya 22, Seminyak", note:"Nine vegan dishes. Tuesday, Thursday and Saturday afternoons only." },
      { title:"Villa Coco Cooking Class", where:"Gg. Villa Coco, Seminyak", note:"Relaxed and good with kids. You keep the apron and the recipes. Less hands-on than the others." },
      { title:"Anika Cooking Class",     where:"Jl. Nuri, Tuban",           note:"Down by the airport, includes pickup. Market tour then nine dishes. Closed Sundays." }
    ]},

  { key:"spa", title:"Massage nearby", blurb:"The first two come to the villa.", map:"massage+spa",
    items:[
      { title:"Sanara Home Massage",  where:"Gg. Drona, Seminyak",         note:"Outcall — they come to you, any hour. Have done groups of eight at once, massages and nails together. Two minutes away." },
      { title:"Edelweiss Spa",        where:"Jl. Raya Seminyak",           note:"Also comes to you, 24 hours. People report therapists arriving within 20 minutes of booking at midnight." },
      { title:"Eden Spa & Beauty",    where:"Jl. Drupadi 20, Seminyak",    note:"Five minutes from the villa and the best reviewed spa in Seminyak by some distance. Fruit and water before, tea after." },
      { title:"Ssamaya Balinese Spa", where:"Jl. Camplung Tanduk 8",       note:"Newer, private rooms, open till 11pm. Book on WhatsApp." },
      { title:"Mello Spa",            where:"Jl. Kayu Aya 10, Seminyak",   note:"The smart option — facials, packages, proper consultation. Shuts at 7." }
    ]},

  { key:"wash", title:"Laundry", blurb:"Lucky is on our street — number 30, we're at 23C.", map:"laundry",
    items:[
      { title:"Lucky Laundry",     where:"Jl. Sari Dewi 30, Seminyak",  note:"Same street as the villa, about a two minute walk. Free pickup and delivery, six hour express, they WhatsApp a photo of the scales before charging." },
      { title:"Ba-bless Laundry",  where:"Jl. Plawa 10A, Seminyak",     note:"Three hour express, free collection, and they'll do fragrance-free if anyone's fussy about detergent." },
      { title:"Laundry Hub",       where:"Gg. Kahyangan 5, Seminyak",   note:"Cheap and same-day. Around 99,000 for three kilos." },
      { title:"Hubit Laundry Express", where:"Jl. Yudistira 11, Seminyak", note:"Cheapest per kilo if you're not in a hurry — about 12,000/kg on the two to three day service. Open till 10pm." },
      { title:"Easy Day Laundry",  where:"Jl. Mertanadi 22E, Kerobokan", note:"Further out but very consistent. Pickup and delivery available." }
    ]},

  { key:"sunset", title:"Sunset spots", blurb:"Sun goes down around 6.15 in August. Get there by 5.30.", map:"sunset+bar",
    items:[
      { title:"Potato Head Sunset Park", where:"Jl. Petitenget, Seminyak", note:"Rooftop above the beach club, 5pm to 9pm only. Same view, none of the crush downstairs. The pick of them." },
      { title:"Double Six Rooftop Bar",  where:"Jl. Double Six, Seminyak", note:"Two-for-one cocktails, opens 5pm. Sunken lounges have a minimum spend but you'll hit it on drinks anyway." },
      { title:"Beach Bar at Alila",      where:"Jl. Petitenget 9A, Seminyak", note:"Live band before sunset, daybeds, 400,000 minimum spend. Calmer than the beach clubs." },
      { title:"Seminyak Beach itself",   where:"Jl. Sarinande, Seminyak",  note:"Free. Walk down, buy a Bintang off someone with a cooler, sit on the sand. Ten minutes from the villa." }
    ]},

  { key:"cheap", title:"Cheap local warungs", blurb:"Where the locals actually eat. 15,000 to 30,000 a plate.", map:"warung",
    items:[
      { title:"Warung Kawan",   where:"Jl. Beraban, Kerobokan",     note:"Around 15,000 a plate and no tourist pricing. Tiny, queues at lunch, most people take away. The corn fritters are the thing." },
      { title:"Warung 3 Putri", where:"Jl. Kayu Aya 18C, Seminyak", note:"Hole in the wall, family run, best nasi goreng around for the money. Easy to walk straight past." },
      { title:"Warung Dayu",    where:"Gg. Bima 17, Seminyak",      note:"Dinner only, 6pm to 9pm. Family run and very cheap. Satay chicken and capcay." },
      { title:"Ferry's",        where:"Jl. Beraban 34, Seminyak",   note:"Full of Balinese workers at lunch. Under 10,000 for a vegetarian plate. Properly spicy — say so if you don't want it." },
      { title:"Warung Kopi",    where:"Jl. Raya Seminyak 22",       note:"Nasi campur about 25,000, in a quiet garden off the main road. Open 9 to 6." },
      { title:"Warung Anyelir", where:"Jl. Raya Seminyak 32",       note:"Go for the ayam betutu. Small portions by our standards, but so cheap you just order two. Closed Sundays." }
    ]},

  { key:"shop", title:"Supermarkets", blurb:"For beer, water, sunscreen and breakfast at the villa.", map:"supermarket",
    items:[
      { title:"Bintang Supermarket", where:"Jl. Raya Seminyak 17",     note:"The big one. Far cheaper than any minimart, huge range, homewares upstairs. Open 7.30am to 10pm." },
      { title:"Frestive Supermarket", where:"Jl. Kunti I, Seminyak",   note:"Best of the lot for fresh stuff — bakery, deli, ready meals. Open 7am to 11pm." },
      { title:"Coco Supermarket",    where:"Jl. Laksamana, Kerobokan", note:"Open 24 hours, which is the point of it. Pricier than Bintang." },
      { title:"Mega Mart",           where:"Seminyak Square",          note:"Groceries plus a decent souvenir section — batik trays, bowls, that sort of thing." },
      { title:"Minimart on our street", where:"Jl. Sari Dewi 24a",     note:"Right next door, open all hours, and fine for a forgotten bottle of water. Check the price before you hand money over — reviews are not kind on that front." }
    ]},

  { key:"out", title:"Days out", blurb:"Worth blocking out a whole day for.", map:"attractions",
    items:[
      { title:"Waterbom Bali", where:"Jl. Kartika Plaza, Kuta", note:"Twenty minutes down the road, 9am to 6pm. Buy tickets online or you'll queue. Cashless inside — load the wristband at the gate. No outside food, so bring towels and eat there. A gazebo is worth it for a group." }
    ]}

/* ============================================================
   Storage — ideas, plus write access to the planner
   ============================================================ */
async function makeStore(){
  if(!FIREBASE.projectId) return localStore();
  try{
    const [{ initializeApp }, fs, fa] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
    const app = initializeApp(FIREBASE);
    try{ await withTimeout(fa.signInAnonymously(fa.getAuth(app)), 8000); }catch(e){ /* open rules */ }
    const db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    const col = fs.collection(db, "ideas");
    const plannerCol = fs.collection(db, "planner");
    const setDoc = fs.doc(db, "settings", "trip");
    return {
      kind:"cloud",
      subscribe(onList, onSettings){
        fs.onSnapshot(col,
          snap => onList(snap.docs.map(d=>({ id:d.id, ...d.data() }))),
          err  => banner("Can't reach the board right now — " + (err.code || err.message))
        );
        fs.onSnapshot(setDoc, d => { if(d.exists() && d.data().start) onSettings(d.data().start); });
      },
      add:    v => withTimeout(fs.addDoc(col, { ...v, createdAt: Date.now() })),
      update: (id,v) => withTimeout(fs.updateDoc(fs.doc(db,"ideas",id), v)),
      remove: id => withTimeout(fs.deleteDoc(fs.doc(db,"ideas",id))),
      toPlanner: v => withTimeout(fs.addDoc(plannerCol, { ...v, createdAt: Date.now() }))
    };
  }catch(e){
    banner("Couldn't reach the shared board, so this is saving on your device only.");
    return localStore();
  }
}

function localStore(){
  const KEY = "mbh_ideas_v1";
  const read = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const write = v => localStorage.setItem(KEY, JSON.stringify(v));
  let cb = ()=>{}, cs = ()=>{};
  const push = () => {
    cb(read());
    try{
      const p = JSON.parse(localStorage.getItem("mbh_planner_v1") || "null");
      if(p?.settings?.start) cs(p.settings.start);
    }catch(e){ /* nothing */ }
  };
  return {
    kind:"local",
    subscribe(onList, onSettings){ cb = onList; cs = onSettings; push(); },
    add(v){ const d = read(); d.push({ ...v, id:"i"+Date.now()+Math.random().toString(36).slice(2,6), createdAt:Date.now() }); write(d); push(); },
    update(id,v){ const d = read(); const i = d.find(x=>x.id===id); if(i) Object.assign(i,v); write(d); push(); },
    remove(id){ write(read().filter(x=>x.id!==id)); push(); },
    toPlanner(v){
      const K = "mbh_planner_v1";
      const p = JSON.parse(localStorage.getItem(K) || '{"items":[],"settings":{}}');
      p.items.push({ ...v, id:"i"+Date.now()+Math.random().toString(36).slice(2,6), createdAt:Date.now() });
      localStorage.setItem(K, JSON.stringify(p));
    }
  };
}

function ideaHtml(x){
  const t = traveller(x.who);
  const votes = x.votes || [];
  const mineVoted = me && votes.includes(me);
  const dots = votes.map(v=>`<i style="background:${traveller(v).colour}"></i>`).join("");
  return `<article class="idea ${x.planned ? "done" : ""}" style="--c:${t.colour}">
    <button class="vote" data-vote="${x.id}" aria-pressed="${!!mineVoted}" aria-label="Vote for ${esc(x.title)}">
      <span>${mineVoted ? "♥" : "♡"}</span><b>${votes.length}</b>
    </button>
    <div class="body">
      <div class="ttl">${esc(x.title)}</div>
      <div class="meta">
        ${x.where ? `<a class="tag" href="${mapUrl(x.title + ' ' + x.where)}" target="_blank" rel="noopener">📍 ${esc(x.where)}</a>` : ""}
        ${x.planned ? `<span class="tag on">In the planner${x.plannedDay ? " · day " + x.plannedDay : ""}</span>` : ""}
        <span class="tag">${esc(t.name)}'s idea</span>
      </div>
      ${x.note ? `<div class="note">${esc(x.note)}</div>` : ""}
      ${votes.length ? `<div class="voters">${dots}<em>${votes.length} of ${TRAVELLERS.length} keen</em></div>` : ""}
      <div class="acts">
        ${x.link ? `<a class="mini" href="${esc(x.link)}" target="_blank" rel="noopener">Link</a>` : ""}
        <button class="mini strong" data-send="${x.id}">${x.planned ? "Add to another day" : "Put it in the planner"}</button>
        <button class="mini" data-edit="${x.id}">Edit</button>
      </div>
    </div>
  </article>`;
}

function render(){
  const t = traveller(me);
  $("meName").textContent = me || "…";
  $("meDot").style.background = t.colour;

  const list = ideas.slice().sort((a,b)=>
    ((b.votes||[]).length - (a.votes||[]).length) || (b.createdAt||0)-(a.createdAt||0));
  const open = list.filter(x=>!x.planned);
  const done = list.filter(x=>x.planned);

  $("sum").textContent = ideas.length
    ? `${ideas.length} idea${ideas.length===1?"":"s"} · ${done.length} already booked in`
    : "Nothing on the board yet";

  paintLocal();

  if(!ideas.length){
    $("body").innerHTML = `<div class="empty">Empty board.<br>Tap something from the list below, or add your own — the others vote, and the winners go straight into the planner.</div>`;
    return;
  }

  let html = "";
  if(open.length){
    html += `<h2 class="sec">Up for grabs</h2>` + open.map(ideaHtml).join("");
  }
  if(done.length){
    html += `<h2 class="sec">Made the cut</h2>` + done.map(ideaHtml).join("");
  }
  $("body").innerHTML = html;
}

function paintLocal(){
  const on = new Set(ideas.map(x => x.title));
  $("local").innerHTML = LOCAL.map((cat, ci) => `
    <details class="cat"${ci === 0 ? " open" : ""}>
      <summary><span class="ct">${esc(cat.title)}</span><span class="cn">${cat.items.length}</span></summary>
      <div class="catbody">
        <p class="blurb">${esc(cat.blurb)}
          <a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=${cat.map}+Seminyak+Bali"
             target="_blank" rel="noopener">Map</a>
        </p>
        <div class="eats">
          ${cat.items.map((e,i) => `
            <button data-peek="${cat.key}|${i}" class="${on.has(e.title) ? "done" : ""}">
              ${esc(e.title)}<em>${on.has(e.title) ? "on the board" : esc(e.where.split(",")[0])}</em>
            </button>`).join("")}
        </div>
      </div>
    </details>`).join("");
}

/* ============================================================
   Sheets
   ============================================================ */
function openSheet(html){ $("sheet").innerHTML = html; $("scrim").classList.add("on"); }
function closeSheet(){ $("scrim").classList.remove("on"); editing = null; }

function pickName(force){
  openSheet(`<h3>Who's this?</h3>
    <p class="sub">so we know whose idea it was</p>
    <div class="namegrid">
      ${TRAVELLERS.map(t=>`<button data-me="${t.name}"><i style="background:${t.colour}"></i>${t.name}</button>`).join("")}
    </div>
    ${force ? "" : `<div class="sheetfoot"><button class="btn ghost" data-close>Cancel</button></div>`}`);
}

function suggestSheet(key, idx){
  const cat = LOCAL.find(c => c.key === key);
  const e = cat.items[+idx];
  const already = ideas.find(x => x.title === e.title);
  const map  = mapLink(e.title, e.where);
  const wa   = waLink(e.title, key);
  const call = telLink(e.title);
  const site = WEB[e.title] || "";
  const shots = galleryFor(e.title);

  const pic = picFor(e.title);
  openSheet(`
    ${pic ? `<img class="peekpic" id="peekMain" src="${shots[0] || pic}" alt="" loading="lazy" onerror="this.remove()">` : ""}
    <h3>${esc(e.title)}</h3>
    <p class="sub">${esc(cat.title)} · ${esc(e.where)}</p>
    <p class="peek">${esc(e.note)}</p>
    ${shots.length > 1 ? `<div class="peekstrip">${shots.map((s,k)=>
        `<img src="${s}" alt="" loading="lazy" data-swap="${s}"
              class="${k===0?"on":""}" onerror="this.remove()">`).join("")}</div>` : ""}
    ${wa || call ? `<a class="bookbtn" href="${wa || call}" target="_blank" rel="noopener">
        ${wa ? "Book on WhatsApp" : "Ring them"}</a>` : ""}
    <div class="peekbtns">
      <a class="mapbtn wide" href="${map}" target="_blank" rel="noopener">Open in Maps</a>
      ${site ? `<a class="mapbtn wide" href="${esc(site)}" target="_blank" rel="noopener">Website</a>` : ""}
    </div>
    ${already ? `<p class="peeknote">Already on the board${(already.votes||[]).length
          ? ` — ${(already.votes||[]).length} of ${TRAVELLERS.length} keen so far` : ""}.</p>` : ""}
    <div class="sheetfoot">
      ${already
        ? `<button class="btn ghost" data-close>Close</button>`
        : `<button class="btn ghost" data-confirm-local="${esc(key)}|${esc(String(idx))}">To the board</button>`}
      <button class="btn" data-send-local="${esc(key)}|${esc(String(idx))}">Into the planner</button>
    </div>`);
}

function ideaSheet(existing){
  const x = existing || {};
  editing = existing ? existing.id : null;
  openSheet(`
    <h3>${existing ? "Edit idea" : "Add an idea"}</h3>
    <p class="sub">anything you fancy doing</p>

    <label for="iTitle">What is it?</label>
    <input id="iTitle" value="${esc(x.title)}" placeholder="Sunrise trek up Mount Batur" autocomplete="off">

    <label for="iWhere">Where</label>
    <input id="iWhere" value="${esc(x.where)}" placeholder="Kintamani" autocomplete="off">

    <label for="iNote">Why</label>
    <textarea id="iNote" placeholder="Leaves at 2am but everyone says it's worth it">${esc(x.note)}</textarea>

    <label for="iLink">Link</label>
    <input id="iLink" value="${esc(x.link)}" placeholder="https://" autocomplete="off">

    <div class="sheetfoot">
      ${existing ? `<button class="btn danger" data-remove="${existing.id}">Remove</button>`
                 : `<button class="btn ghost" data-close>Cancel</button>`}
      <button class="btn" data-save>Save</button>
    </div>`);
  setTimeout(()=>$("iTitle").focus(), 60);
}

function sendSheet(src){
  sending = src;
  sendSlot = "noon";
  openSheet(`
    <h3>Into the planner</h3>
    <p class="sub">${esc(src.title)}</p>

    <label for="sDay">Which day?</label>
    <select id="sDay">
      ${Array.from({length:TRIP_DAYS},(_,k)=>`<option value="${k+1}">${dayLabel(k+1)}</option>`).join("")}
    </select>

    <label for="sTime">What time? (optional)</label>
    <input type="time" id="sTime" value="">

    <label>When in the day?</label>
    <div class="seg" id="sSlot">
      ${SLOTS.map(s=>`<button type="button" data-slot="${s.key}" aria-pressed="${s.key==="noon"}">${s.label}</button>`).join("")}
    </div>

    <div class="sheetfoot">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn" data-confirm>Add it</button>
    </div>`);

  $("sTime").addEventListener("change", () => {
    const v = $("sTime").value;
    if(!v) return;
    const h = +v.split(":")[0];
    sendSlot = h < 11 ? "morning" : h < 17 ? "noon" : "evening";
    $("sSlot").querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.slot === sendSlot));
  });
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", async e => {
  const hit = s => e.target.closest(s);

  const mePick = hit("[data-me]");
  if(mePick){ me = mePick.dataset.me; localStorage.setItem("mbh_me", me); closeSheet(); render(); return; }

  const swap = hit("[data-swap]");
  if(swap){
    const main = $("peekMain");
    if(main) main.src = swap.dataset.swap;
    document.querySelectorAll(".peekstrip img").forEach(x => x.classList.toggle("on", x === swap));
    return;
  }

  const peek = hit("[data-peek]");
  if(peek){
    const [key, idx] = peek.dataset.peek.split("|");
    suggestSheet(key, idx);
    return;
  }

  const addLocal = hit("[data-confirm-local]");
  if(addLocal){
    if(!me) return pickName(true);
    const [key, idx] = addLocal.dataset.confirmLocal.split("|");
    const e = LOCAL.find(c => c.key === key).items[+idx];
    try{
      const w = store.add({ title:e.title, where:e.where, note:e.note,
        link: WEB[e.title] || "",
        book: waLink(e.title, key) || telLink(e.title) || "",
        who:me, votes:[me], planned:false });
      closeSheet();
      celebrate("idea");
      await w;
      toast("On the board — scroll up to vote");
    }catch(err){ toast(err.message); }
    return;
  }

  const v = hit("[data-vote]");
  if(v){
    if(!me) return pickName(true);
    const x = ideas.find(i=>i.id===v.dataset.vote);
    if(!x) return;
    const votes = x.votes || [];
    const next = votes.includes(me) ? votes.filter(n=>n!==me) : [...votes, me];
    try{
      if(!votes.includes(me)) celebrate("vote");
      await store.update(x.id, { votes: next });
    }catch(err){ toast(err.message); }
    return;
  }

  const sl = hit("[data-slot]");
  if(sl){
    sendSlot = sl.dataset.slot;
    $("sSlot").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===sl));
    return;
  }

  const send = hit("[data-send]");
  if(send){
    if(!me) return pickName(true);
    const x = ideas.find(i => i.id === send.dataset.send);
    if(x) sendSheet({ title:x.title, where:x.where, note:x.note, link:x.link,
                      book:x.book || waLink(x.title,"eat") || telLink(x.title) || "",
                      pic:picFor(x.title), who:x.who, ideaId:x.id });
    return;
  }

  const sendLocal = hit("[data-send-local]");
  if(sendLocal){
    if(!me) return pickName(true);
    const [key, idx] = sendLocal.dataset.sendLocal.split("|");
    const e = LOCAL.find(c => c.key === key).items[+idx];
    sendSheet({ title:e.title, where:e.where, note:e.note,
                link: WEB[e.title] || "",
                book: waLink(e.title, key) || telLink(e.title) || "",
                pic:  picFor(e.title) });
    return;
  }

  if(hit("[data-confirm]")){
    if(!sending) return;
    if(!me) return pickName(true);
    const day = Number($("sDay").value);
    try{
      const w = store.toPlanner({
        day, slot: sendSlot,
        title: sending.title,
        place: sending.where || "",
        link:  sending.link || "",
        book:  sending.book || "",
        pic:   sending.pic  || "",
        notes: sending.note || "",
        time:  $("sTime").value || "",
        cost:"", travel:"",
        status:"maybe",
        who: sending.who || me
      });
      await w;
      if(sending.ideaId) store.update(sending.ideaId, { planned:true, plannedDay:day, plannedSlot:sendSlot });
      closeSheet();
      celebrate("planner");
      toast("Added to day " + day);
    }catch(err){ toast(err.message); }
    return;
  }

  const ed = hit("[data-edit]");
  if(ed){ const x = ideas.find(i=>i.id===ed.dataset.edit); if(x) ideaSheet(x); return; }

  const rm = hit("[data-remove]");
  if(rm){
    try{ await store.remove(rm.dataset.remove); closeSheet(); toast("Removed"); }
    catch(err){ toast(err.message); }
    return;
  }

  if(hit("[data-save]")){
    const title = $("iTitle").value.trim();
    if(!title){ toast("Give it a name first"); $("iTitle").focus(); return; }
    const val = {
      title,
      where: $("iWhere").value.trim(),
      note:  $("iNote").value.trim(),
      link:  $("iLink").value.trim()
    };
    try{
      if(editing) await store.update(editing, val);
      else { celebrate("idea"); await store.add({ ...val, who: me, votes: me ? [me] : [], planned:false }); }
      closeSheet(); toast("On the board");
    }catch(err){ toast(err.message); }
    return;
  }

  if(hit("[data-close]") || e.target.id === "scrim"){ closeSheet(); return; }
  if(e.target.id === "btnSwitch"){ pickName(false); return; }
  if(e.target.id === "btnAdd"){ if(!me) return pickName(true); ideaSheet(null); return; }
});

document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* ============================================================
   Go
   ============================================================ */
(async function start(){
  store = await makeStore();
  if(store.kind === "local" && !FIREBASE.projectId) banner("Test mode — saving on this device only.");
  store.subscribe(
    list => { ideas = list; render(); },
    start => { tripStart = start; render(); }
  );
  render();
  if(!me) pickName(true);
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
