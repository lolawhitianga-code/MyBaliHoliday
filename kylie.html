<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16A97C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bali">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Well done you · My Bali Holiday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1B1730; --sand:#FFF3E2; --dusk:#9B5DE5; --pandan:#16A97C; --marigold:#FF9F1C; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:calc(34px + env(safe-area-inset-top)) 22px calc(34px + env(safe-area-inset-bottom));
  color:#fff;font-family:'Outfit',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;text-align:center;position:relative;overflow:hidden;
  background:
    radial-gradient(180px 180px at 50% 22%, rgba(255,209,102,.5), rgba(255,159,28,0) 70%),
    linear-gradient(170deg,#0F2E24 0%,#16A97C 48%,#7FD8C0 100%);
}
body::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,#FF4D8D,#FF9F1C,#16A97C,#0BA5C7,#9B5DE5);
}

.medal{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  font-size:52px;line-height:1;margin:0 auto 22px;
  background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{ from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }

.eyebrow{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;opacity:.8;margin:0 0 12px;
}
h1{
  font-family:'Fraunces',serif;font-weight:900;font-size:clamp(34px,10vw,58px);
  line-height:.98;margin:0 0 4px;font-variation-settings:'SOFT' 40,'WONK' 1;
  text-shadow:0 2px 22px rgba(6,40,30,.4);
  max-width:12ch;
}
.sub{
  font-size:17.5px;line-height:1.5;opacity:.92;margin:16px 0 0;max-width:30ch;
}
.sub b{font-weight:600}

.ticks{
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:26px 0 0;max-width:400px;
}
.ticks span{
  font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);
  border-radius:999px;padding:5px 12px;backdrop-filter:blur(6px);
}

.go{
  display:inline-block;margin-top:32px;background:#fff;color:#0F2E24;
  border:0;border-radius:999px;padding:15px 30px;font:inherit;font-weight:600;font-size:16px;
  cursor:pointer;box-shadow:0 10px 30px -12px rgba(6,40,30,.7);
  transition:transform .14s ease;
}
.go:hover{transform:translateY(-2px)}
.small{
  margin-top:18px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;
  opacity:.6;
}
.small a{color:#fff;text-decoration:underline;text-underline-offset:4px}
.buildstamp{
  text-align:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:rgba(255,255,255,.55);margin:20px 0 0;text-shadow:0 1px 6px rgba(27,23,48,.6);
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>

<div class="medal">🏆</div>

<p class="eyebrow">Kylie</p>
<h1>Well done you</h1>
<p class="sub">Great — you've done <b>everything</b>. Nothing left on your list. Absolutely nothing at all.</p>

<div class="ticks">
  <span>✓ Visa</span>
  <span>✓ Levy paid</span>
  <span>✓ Arrival card</span>
  <span>✓ eSIM</span>
  <span>✓ Packed</span>
  <span>✓ Everything else</span>
</div>

<a class="go" href="home.html">Carry on to the holiday →</a>

  <p class="buildstamp">build v75</p>
<p class="small">Not Kylie? <a href="index.html">Go back</a></p>

</body>
</html>
