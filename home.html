<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bali">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>My Bali Holiday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:        #1B1730;
  --ink-soft:   #4A4266;
  --sand:       #FFF3E2;
  --sand-deep:  #F6E3C8;
  --line:       #E4CDA9;

  --frangipani: #FF4D8D;
  --lagoon:     #0BA5C7;
  --marigold:   #FF9F1C;
  --pandan:     #16A97C;
  --dusk:       #9B5DE5;

  --shadow: 0 2px 0 rgba(27,23,48,.10), 0 10px 26px -14px rgba(27,23,48,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sand);color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- header ---------- */
.top{
  position:relative;overflow:hidden;text-align:center;color:#fff;
  padding:calc(34px + env(safe-area-inset-top)) 20px 40px;
  background:
    radial-gradient(140px 140px at 78% 90%, rgba(255,209,102,.55), rgba(255,159,28,0) 70%),
    linear-gradient(178deg, rgba(27,23,48,.72) 0%, rgba(75,42,99,.50) 40%, rgba(196,63,118,.42) 72%, rgba(255,122,69,.34) 100%),
    var(--hero, url('hero-home.jpg')) center 34% / cover no-repeat;
}
.top::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--frangipani),var(--marigold),var(--pandan),var(--lagoon),var(--dusk));
}
.eyebrow{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;opacity:.72;margin:0 0 10px;
text-shadow:0 1px 8px rgba(27,23,48,.6);}
.wordmark{
  font-family:'Fraunces',serif;font-weight:900;font-size:clamp(36px,11vw,64px);
  line-height:.92;margin:0;font-variation-settings:'SOFT' 40,'WONK' 1;
}
.daterange{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.08em;margin:14px 0 0;opacity:.85}

/* ---------- boarding pass (signature) ---------- */
main{max-width:780px;margin:0 auto;padding:0 14px}
.pass{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  margin:-24px 0 26px;position:relative;
}
.pass .route{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:16px 18px 4px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.2em;
}
.pass .route b{font-size:22px;letter-spacing:.06em;font-weight:500}
.pass .route b.multi{font-size:14px;letter-spacing:.16em}
.pass .route .plane{font-size:16px;opacity:.5}
.pass .yours{
  text-align:center;font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);opacity:.7;margin:2px 0 0;
}
.pass .big{text-align:center;padding:6px 18px 22px}
.pass .big .n{
  font-family:'Fraunces',serif;font-weight:900;font-size:clamp(62px,20vw,96px);
  line-height:.9;display:block;font-variation-settings:'SOFT' 40,'WONK' 1;
  background:linear-gradient(96deg,var(--frangipani),var(--marigold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.pass .big .w{
  font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-soft);
}
.stub{
  position:relative;border-top:2px dashed var(--line);
  display:flex;justify-content:center;gap:10px;padding:13px;flex-wrap:wrap;
}
.stub::before,.stub::after{
  content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;
  background:var(--sand);border:1px solid var(--line);
}
.stub::before{left:-11px;clip-path:inset(0 0 0 50%)}
.stub::after{right:-11px;clip-path:inset(0 50% 0 0)}
.clock{
  font-family:'DM Mono',monospace;font-size:12.5px;
  background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:5px 13px;
}
.clock span{opacity:.55;letter-spacing:.12em;margin-right:4px}

/* ---------- bottom bar ---------- */
.buildstamp{
  text-align:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:var(--ink-soft);opacity:.45;margin:26px 0 0;
}
/* ============================================================
   ARRIVAL DAY — only ever seen once
   ============================================================ */
body.party .top{
  background:
    radial-gradient(200px 160px at 18% 12%, rgba(255,209,102,.55), rgba(255,159,28,0) 70%),
    radial-gradient(220px 180px at 84% 20%, rgba(255,77,141,.5), rgba(255,77,141,0) 70%),
    linear-gradient(178deg,#2A1046 0%,#8E1F5E 34%,#E2543C 68%,#FFB347 100%);
  background-size:200% 200%, 200% 200%, 100% 240%;
  animation:partyglow 9s ease-in-out infinite;
  padding-top:calc(30px + env(safe-area-inset-top));
}
@keyframes partyglow{
  0%,100%{background-position:0% 0%, 100% 0%, 50% 0%}
  50%    {background-position:100% 60%, 0% 40%, 50% 100%}
}
body.party .wordmark{
  font-size:clamp(38px,12vw,72px);
  background:linear-gradient(96deg,#FFF6DC,#FFD166 40%,#FF9F1C 62%,#FFF6DC);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 3.2s linear infinite;
  filter:drop-shadow(0 3px 18px rgba(120,30,0,.45));
}
@keyframes shine{ to{background-position:220% center} }
body.party .eyebrow{color:#FFD166;opacity:1;animation:blink 1.5s steps(2,end) infinite}
@keyframes blink{ 50%{opacity:.45} }
body.party .pass{
  border-color:rgba(255,209,102,.85);
  box-shadow:0 0 0 1px rgba(255,209,102,.5), 0 18px 44px -18px rgba(180,60,0,.65);
  animation:bob 3.4s ease-in-out infinite;
}
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
body.party .pass .big .n{
  background:linear-gradient(96deg,#FF4D8D,#FF9F1C 55%,#FFD166);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
body.party .daterange{color:#FFE9B8;opacity:1}

/* streamers and confetti */
#party{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
#party .s{position:absolute;top:-24vh;animation:pfall var(--dur) linear var(--delay) infinite}
#party .s span{
  display:block;animation:psway calc(var(--dur)/3.2) ease-in-out infinite alternate;
  transform-origin:center;
}
#party .s.rib span{
  width:9px;height:var(--len);border-radius:5px;
  background:repeating-linear-gradient(160deg,var(--c1) 0 11px,var(--c2) 11px 22px);
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
#party .s.dot span{
  width:var(--len);height:var(--len);border-radius:2px;background:var(--c1);
  box-shadow:0 2px 6px rgba(0,0,0,.16);
}
#party .s.pet span{
  width:var(--len);height:var(--len);border-radius:60% 0 60% 0;background:var(--c1);
}
@keyframes pfall{
  0%  {transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  6%  {opacity:1}
  92% {opacity:1}
  100%{transform:translate3d(var(--dx),140vh,0) rotate(var(--rot));opacity:0}
}
@keyframes psway{ from{transform:translateX(-18px) rotate(-12deg)} to{transform:translateX(18px) rotate(14deg)} }

/* the banner */
.partybar{
  position:relative;z-index:61;margin:-14px 14px 20px;
  background:linear-gradient(100deg,#16A97C,#0BA5C7 55%,#9B5DE5);
  border-radius:16px;padding:14px 16px;color:#fff;
  box-shadow:0 14px 34px -16px rgba(11,60,50,.7);
  display:flex;align-items:center;gap:13px;
}
.partybar .em{font-size:28px;line-height:1;flex:none;animation:bob 2.6s ease-in-out infinite}
.partybar .tx{flex:1;min-width:0}
.partybar .tx b{font-family:'Fraunces',serif;font-weight:900;font-size:19px;display:block;line-height:1.15}
.partybar .tx span{font-size:13.5px;opacity:.92;display:block;margin-top:2px;line-height:1.4}
.partybar button{
  flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);
  color:#fff;border-radius:999px;padding:8px 14px;font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:.1em;backdrop-filter:blur(6px);
}
.partybar button:hover{background:#fff;color:#0B4A3A}
@media (prefers-reduced-motion:reduce){
  body.party .top,body.party .wordmark,body.party .eyebrow,body.party .pass,.partybar .em{animation:none}
  #party{display:none}
}

/* the little music control that shows while we're there */
.tune{
  position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:55;
  border:1px solid var(--line);background:rgba(255,243,226,.94);color:var(--ink-soft);
  border-radius:999px;padding:9px 15px;font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:.1em;backdrop-filter:blur(10px);box-shadow:var(--shadow);
}
.tune.on{background:var(--ink);color:#FFD166;border-color:var(--ink)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,243,226,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav a,.nav button{
  flex:1;border:0;background:none;text-align:center;padding:8px 2px 9px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);
}
.nav b{display:block;font-size:18px;font-weight:400;line-height:1.3;margin-bottom:2px}
.nav [aria-current="page"]{color:var(--ink);font-weight:500}
.nav .off b{opacity:.4}
.nav .off{opacity:.55}

/* ---------- install prompt ---------- */
.install{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 13px;margin-bottom:22px;box-shadow:var(--shadow);
}
.install img{width:38px;height:38px;border-radius:10px;flex:none}
.install .txt{flex:1;font-size:13px;line-height:1.35}
.install .txt b{display:block;font-weight:600;font-size:14px}
.install .go{
  background:var(--ink);color:var(--sand);border:0;border-radius:9px;
  padding:8px 13px;font-size:13px;font-weight:500;flex:none;
}
.install .x{background:none;border:0;font-size:19px;line-height:1;color:var(--ink-soft);padding:2px 4px;flex:none}

.skel{padding:22px 16px;text-align:center;color:var(--ink-soft);font-size:14px;opacity:.7}

/* ---------- section headings ---------- */
h2.sec{
  font-family:'DM Mono',monospace;font-weight:500;font-size:11.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 11px 2px;
}

/* ---------- crew ---------- */
.crew{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.who{
  display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 8px;font-weight:500;font-size:14.5px;
}
.who i{width:16px;height:16px;border-radius:50%;display:block}
.who em{
  font-family:'DM Mono',monospace;font-style:normal;font-size:11px;
  letter-spacing:.1em;opacity:.5;margin-left:1px;
}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:12px}
@media (min-width:620px){ .tiles{grid-template-columns:repeat(3,1fr)} }
.tile{
  background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 14px 14px;
  display:block;position:relative;overflow:hidden;
  transition:transform .14s ease, box-shadow .14s ease;
}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .g{font-size:22px;line-height:1;display:block;margin-bottom:9px}
.tile .n{font-family:'Fraunces',serif;font-weight:700;font-size:17.5px;line-height:1.15;display:block}
.tile .d{font-size:12.5px;color:var(--ink-soft);line-height:1.35;margin-top:4px;display:block}
.tile.soon{opacity:.62}
.tile.soon:hover{transform:none;box-shadow:none}
.tag{
  position:absolute;top:11px;right:11px;font-family:'DM Mono',monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;background:var(--sand-deep);
  border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--ink-soft);
}
.tile:focus-visible,.today .foot:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

/* side door — the casino, which has nothing to do with Bali */
.sidedoor{
  display:flex;align-items:center;gap:13px;margin-top:16px;
  background:linear-gradient(100deg,#141024,#2A1B3D 60%,#3D2410);
  border:1px solid #4A3A22;border-radius:15px;padding:14px 15px;color:#F6E3C8;
  box-shadow:var(--shadow);transition:transform .14s ease, box-shadow .14s ease;
}
.sidedoor:hover{transform:translateY(-2px);box-shadow:0 3px 0 rgba(27,23,48,.14), 0 16px 34px -14px rgba(27,23,48,.6)}
.sidedoor .ic{
  width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px;
  background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.28);
}
.sidedoor .t{flex:1;min-width:0}
.sidedoor .t b{
  display:block;font-family:'Fraunces',serif;font-weight:700;font-size:17px;
  color:#FFD166;letter-spacing:.01em;
}
.sidedoor .t span{
  display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;opacity:.6;margin-top:3px;
}
.sidedoor .go{font-size:19px;opacity:.5;flex:none}

/* another side door — a business tool, not a Bali thing, so it's dressed
   like its own console rather than the sunset theme, and only Mark sees it */
.bizdoor{
  display:flex;align-items:center;gap:13px;margin-top:11px;
  background:linear-gradient(100deg,#0B0D10,#14171C 60%,#1B1F26);
  border:1px solid #2E333C;border-radius:15px;padding:14px 15px;color:#E8E4DA;
  box-shadow:var(--shadow);transition:transform .14s ease, box-shadow .14s ease;
  font-family:'Outfit',sans-serif;
}
.bizdoor:hover{transform:translateY(-2px);box-shadow:0 3px 0 rgba(27,23,48,.14), 0 16px 34px -14px rgba(27,23,48,.6)}
.bizdoor .ic{
  width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:19px;
  background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.32);
  overflow:hidden;
}
.bizdoor .ic img{width:100%;height:100%;object-fit:cover;display:block}
.bizdoor .t{flex:1;min-width:0}
.bizdoor .t b{
  display:block;font-family:'DM Mono',monospace;font-weight:500;font-size:15px;
  color:#D8B94B;letter-spacing:.01em;
}
.bizdoor .t span{
  display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.55;margin-top:3px;
}
.bizdoor .go{font-size:19px;opacity:.5;flex:none}

.footnote{
  text-align:center;font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:.1em;color:var(--ink-soft);opacity:.7;margin:26px 0 0;
}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);
  background:var(--ink);color:var(--sand);padding:11px 18px;border-radius:999px;
  font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:all .2s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">mybaliholiday.kiwi</p>
  <h1 class="wordmark">Project 2033</h1>
  <p class="daterange" id="daterange">—</p>
</header>

<main>

  <div id="bizdoor"></div>

  <a class="sidedoor" href="nz-2026-election-quiz.html">
    <span class="ic">🇳🇿</span>
    <span class="t"><b>Where do you stand?</b><span>2026 election quiz — also nothing to do with Bali</span></span>

  <p class="footnote">five of us · fourteen days · one very long flight</p>
  <p class="buildstamp">build v75</p>
</main>

<nav class="nav">

  <a href="money.html"><b>💸</b>Money</a>
  <a href="photos.html"><b>📸</b>Photos</a>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   Same settings block as the planner. If you change one, change
   both — or say the word and I'll pull them into a shared file.
   ============================================================ */
const FIREBASE = {
  apiKey: "AIzaSyB1NnJlvpL_dv7aPrAeFGtl5MM1oSa1YPk",
  authDomain: "mybaliholiday-5170c.firebaseapp.com",
  projectId: "mybaliholiday-5170c",
  storageBucket: "mybaliholiday-5170c.firebasestorage.app",
  messagingSenderId: "29285891302",
  appId: "1:29285891302:web:9497074c278aed8c0ccf27"
};

const TRAVELLERS = [
  { name:"Mark",   colour:"#0BA5C7", from:"AKL" },
  { name:"Claire", colour:"#FF9F1C", from:"SYD" },
  { name:"Clare",  colour:"#16A97C", from:"AKL" },
  { name:"Kylie",  colour:"#9B5DE5", from:"ADL" },
  { name:"Alice",  colour:"#FF4D8D", from:"SYD" }
];

const TRIP_DAYS = 14;
const DEFAULT_START = "2026-08-08";

const TILES = [
  { href:"money.html",    glyph:"💸", name:"Money",         desc:"Who paid, and who owes who",         c:"var(--marigold)" },
  { href:"flights.html",  glyph:"✈️", name:"Flights",       desc:"Who's on what plane, and when",      c:"var(--lagoon)" },
  { href:"stays.html",    glyph:"🛏", name:"Where we stay", desc:"Addresses, wifi codes, check-ins",   c:"var(--pandan)" },
  { href:"photos.html",   glyph:"📸", name:"Photos",        desc:"This trip, and every one before",    c:"var(--dusk)" },
  { href:"shopping.html", glyph:"🛒", name:"Groceries",     desc:"One shared list for the villa",       c:"var(--pandan)" },
  { href:"packing.html",  glyph:"🎒", name:"Packing",       desc:"Who's bringing what",                c:"var(--marigold)" },
  { href:"ideas.html",    glyph:"💡", name:"Ideas",         desc:"Chuck it in, we'll vote on it",      c:"var(--lagoon)" },
  { href:"admin.html",    glyph:"🔧", name:"Admin",          desc:"The database, back of house",         c:"var(--ink-soft)", only:"Mark" },
  { href:"stars.html",    glyph:"⭐", name:"Gold stars",     desc:"Who's actually doing things",        c:"var(--marigold)" },
  { href:"before.html",    glyph:"🛂", name:"Before you fly",  desc:"Visas, forms and eSIMs",             c:"var(--lagoon)" },
  { href:"emergency.html", glyph:"🩹", name:"If it goes wrong", desc:"Insurance, hospital, consulate",  c:"var(--frangipani)" }
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let tripStart = DEFAULT_START;

const dayDate = i => { const d = new Date(tripStart+"T00:00:00"); d.setDate(d.getDate()+i-1); return d; };

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2400);
}

/* ---------- data ---------- */
async function connect(){
  if(!FIREBASE.projectId){
    try{
      const d = JSON.parse(localStorage.getItem("mbh_planner_v1") || "null");
      if(d?.settings?.start) tripStart = d.settings.start;
    }catch(e){ /* nothing saved yet */ }
    paintAll(); pickHero();
    return;
  }
  try{
    const [{ initializeApp }, fs, fa] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
    const app = initializeApp(FIREBASE);

    // Silent sign-in so the security rules have something to check.
    try{ await fa.signInAnonymously(fa.getAuth(app)); }
    catch(e){ /* open rules will still let us through */ }

    const db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    fs.onSnapshot(fs.doc(db,"settings","trip"), d => {
      if(d.exists() && d.data().start){ tripStart = d.data().start; paintAll(); }
    });
    fs.onSnapshot(fs.collection(db,"wall"), snap => {
      const up = snap.docs.map(d => d.data().data).filter(Boolean);
      wallPool = [...WALL_BUILTIN, ...up];
      pickHero();
    }, () => pickHero());
  }catch(e){
    toast("Couldn't reach the trip data just now");
  }
}

/* ---------- painting ---------- */
function paintRange(){
  const target = new Date("2033-01-01T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((target - today) / 86400000);
  $("daterange").textContent = days > 0
    ? `${days.toLocaleString("en-NZ")} day${days === 1 ? "" : "s"} to 2033`
    : "2033 is here";
}





function paintTiles(){
  const who = localStorage.getItem("mbh_me");
  $("tiles").innerHTML = TILES.filter(t => !t.only || t.only === who).map(t=>{
    const inner = `<span class="g">${t.glyph}</span>
      <span class="n">${t.name}</span>
      <span class="d">${t.desc}</span>
      ${t.href ? "" : `<span class="tag">soon</span>`}`;
    return t.href
      ? `<a class="tile" style="--c:${t.c}" href="${t.href}">${inner}</a>`
      : `<button class="tile soon" style="--c:${t.c}" data-soon="${esc(t.name)}">${inner}</button>`;
  }).join("");
}

let tuneDone = false;
function paintAll(){
  paintRange();
  if(isArrivalDay()){ startParty(); return; }
  if(!tuneDone && tripDay() >= 2){ tuneDone = true; tripTune(); }
}

document.addEventListener("click", e=>{
  const s = e.target.closest("[data-soon]");
  if(s) toast(s.dataset.soon + " isn't built yet — next on the list");
});


/* ============================================================
   Header photo — a different one from the wall on every load
   ============================================================ */
const WALL_BUILTIN = ["photo-1.jpg","photo-2.jpg","photo-3.jpg","photo-4.jpg","photo-5.jpg",
                      "photo-6.jpg","photo-7.jpg","photo-8.jpg","photo-9.jpg","photo-10.jpg"];
let wallPool = [...WALL_BUILTIN], heroPicked = false;

function pickHero(){
  if(heroPicked || !wallPool.length) return;
  heroPicked = true;
  // don't repeat whatever we showed last time if we can help it
  const last = sessionStorage.getItem("mbh_last_hero");
  let pool = wallPool.length > 1 ? wallPool.filter(x => x.slice(0, 120) !== last) : wallPool;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  try{ sessionStorage.setItem("mbh_last_hero", pick.slice(0, 120)); }catch(e){ /* full, never mind */ }
  document.querySelector(".top").style.setProperty("--hero", `url("${pick}")`);
}

// if the wall is slow to arrive, go with the built-ins
setTimeout(pickHero, 500);


/* ============================================================
   ARRIVAL DAY
   Fires when today is day one. Add ?party to the URL to see it
   early, and ?party=off to force it back to normal.
   ============================================================ */
const PARTY_COLOURS = [
  ["#FF4D8D","#FFB3D0"],  // frangipani
  ["#FFD166","#FF9F1C"],  // temple gold
  ["#16A97C","#7FD8C0"],  // offering green
  ["#0BA5C7","#8FE3F5"],  // lagoon
  ["#9B5DE5","#D7BBFF"],  // dusk
  ["#F4EEDF","#FFFFFF"]   // frangipani white
];

let gamelan = null;

function isArrivalDay(){
  const q = new URLSearchParams(location.search).get("party");
  if(q === "off") return false;
  if(q !== null) return true;
  const start = new Date(tripStart + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  return start.getTime() === today.getTime();
}

/* ---------- the falling stuff ---------- */
function streamers(){
  if(document.getElementById("party")) return;
  const wrap = document.createElement("div");
  wrap.id = "party";
  let h = "";
  for(let i = 0; i < 54; i++){
    const [c1, c2] = PARTY_COLOURS[i % PARTY_COLOURS.length];
    const kind = i % 3 === 0 ? "rib" : i % 3 === 1 ? "dot" : "pet";
    const len  = kind === "rib" ? (52 + Math.random() * 90) : (7 + Math.random() * 11);
    h += `<div class="s ${kind}" style="
        left:${Math.random() * 100}%;
        --dur:${5.5 + Math.random() * 6}s;
        --delay:${-Math.random() * 9}s;
        --dx:${(Math.random() * 2 - 1) * 26}vw;
        --rot:${(Math.random() * 2 - 1) * 900}deg;
        --len:${len}px; --c1:${c1}; --c2:${c2};
      "><span></span></div>`;
  }
  wrap.innerHTML = h;
  document.body.appendChild(wrap);
}

/* ---------- gamelan ----------
   Balinese metallophones are tuned in pairs a few hertz apart, and that
   beating is what gives gamelan its shimmer. So every note is played twice,
   slightly detuned, with inharmonic partials like a struck bronze bar. */
function makeGamelan(){
  let ctx, timer = null, bar = 0, playing = false, limit = 0;

  // pelog selisir, in cents above the tonic
  const CENTS = [0, 120, 270, 670, 785];
  const TONIC = 262;
  const note = i => {
    const oct = Math.floor(i / 5), deg = ((i % 5) + 5) % 5;
    return TONIC * Math.pow(2, CENTS[deg] / 1200 + oct);
  };

  function strike(freq, at, dur, vol){
    // a bronze bar: fundamental plus two inharmonic partials
    [[1, 1], [2.39, .34], [4.61, .13]].forEach(([mult, amp]) => {
      [0, 6.5].forEach(beat => {              // the paired detuning
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(freq * mult + beat, at);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(vol * amp, at + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(at); o.stop(at + dur + 0.05);
      });
    });
  }

  function gong(at){
    [[1, 1], [1.52, .5], [2.7, .22]].forEach(([mult, amp]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(65.4 * mult, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.22 * amp, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 4.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(at); o.stop(at + 4.4);
    });
  }

  // an interlocking figure — the two halves of a kotekan
  const A = [0, 2, 3, 2, 4, 3, 2, 0];
  const B = [3, 4, 5, 4, 6, 5, 4, 3];

  function schedule(){
    const step = 0.235;
    const at0 = ctx.currentTime + 0.06;
    if(bar % 2 === 0) gong(at0);
    for(let i = 0; i < 8; i++){
      const t = at0 + i * step;
      strike(note(A[i]), t, 1.5, 0.085);
      if(i % 2 === 1) strike(note(B[i]) , t, 1.1, 0.055);
      if(i === 0) strike(note(A[0] - 5), t, 2.4, 0.07);   // low punctuation
    }
    bar++;
    if(limit && bar >= limit){
      // let the last notes ring out, then pack up quietly
      timer = setTimeout(() => { playing = false; if(ctx){ ctx.close().catch(()=>{}); ctx = null; } }, 5000);
      return;
    }
    timer = setTimeout(schedule, step * 8 * 1000);
  }

  return {
    get playing(){ return playing; },
    /* bars = 0 loops forever, otherwise it plays that many and stops */
    start(bars){
      if(playing) return true;
      try{
        if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === "suspended") ctx.resume();
        if(ctx.state !== "running") return false;
      }catch(e){ return false; }
      playing = true; bar = 0; limit = bars || 0; schedule();
      return true;
    },
    stop(){
      playing = false;
      if(timer) clearTimeout(timer);
      timer = null;
      if(ctx) ctx.close().catch(()=>{});
      ctx = null;
    }
  };
}

function partyBar(){
  const el = document.createElement("div");
  el.className = "partybar";
  el.innerHTML = `
    <span class="em">🌺</span>
    <span class="tx"><b>Selamat datang — day one</b>
      <span>Fourteen days of this. Go and get a Bintang.</span></span>
    <button id="partySound">♪ music</button>`;
  document.querySelector("main").prepend(el);

  const btn = document.getElementById("partySound");
  const paint = () => {
    btn.textContent = gamelan && gamelan.playing ? "♪ music off" : "♪ music on";
  };
  btn.addEventListener("click", () => {
    if(!gamelan) gamelan = makeGamelan();
    if(gamelan.playing){ gamelan.stop(); localStorage.setItem("mbh_muted","1"); }
    else{ localStorage.setItem("mbh_muted","0"); if(!gamelan.start()) toast("Turn the ringer up"); }
    paint();
  });

  // try to start on its own; browsers usually want a tap first, so fall back
  gamelan = makeGamelan();
  if(localStorage.getItem("mbh_muted") !== "1"){
    if(!gamelan.start()){
      const kick = () => {
        if(gamelan.start()){ paint(); removeEventListener("pointerdown", kick, true); }
      };
      addEventListener("pointerdown", kick, true);
    }
  }
  paint();
}

/* which day of the trip is it? 0 means we're not on it */
function tripDay(){
  const start = new Date(tripStart + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const n = Math.round((today - start) / 86400000) + 1;
  return (n >= 1 && n <= TRIP_DAYS) ? n : 0;
}

/* A short burst of gamelan on roughly one visit in three — enough to feel like
   you're somewhere, not so much that anyone reaches for the mute. */
function tripTune(){
  const btn = document.createElement("button");
  btn.className = "tune";
  btn.id = "tuneBtn";
  document.body.appendChild(btn);

  const paint = () => {
    const off = localStorage.getItem("mbh_muted") === "1";
    btn.textContent = off ? "♪ off" : "♪ on";
    btn.classList.toggle("on", !off);
  };
  paint();

  btn.addEventListener("click", () => {
    const off = localStorage.getItem("mbh_muted") === "1";
    localStorage.setItem("mbh_muted", off ? "0" : "1");
    if(off){
      if(!gamelan) gamelan = makeGamelan();
      gamelan.start(2);
    }else if(gamelan){
      gamelan.stop();
    }
    paint();
  });

  if(localStorage.getItem("mbh_muted") === "1") return;
  if(Math.random() > 0.35) return;                 // not every time

  gamelan = makeGamelan();
  const go = () => gamelan.start(2);
  if(!go()){
    const kick = () => { if(go()) removeEventListener("pointerdown", kick, true); };
    addEventListener("pointerdown", kick, true);
  }
}

function startParty(){
  if(document.body.classList.contains("party")) return;
  document.body.classList.add("party");
  document.querySelector(".eyebrow").textContent = "it's happening";
  document.querySelector(".wordmark").innerHTML = "We're in<br>Bali";
  streamers();
  partyBar();
}


/* ---------- keep it on the home screen ---------- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferred = null;

function showInstall(kind){
  if(standalone || localStorage.getItem("mbh_install_hidden")) return;
  $("installSlot").innerHTML = `
    <div class="install">
      <img src="icon-192.png" alt="">
      <div class="txt">
        <b>Keep it on your home screen</b>
        ${kind === "button"
          ? "Opens full screen, and still works with no signal."
          : "Tap Share, then <span style='font-weight:600'>Add to Home Screen</span>."}
      </div>
      ${kind === "button" ? `<button class="go" id="doInstall">Install</button>` : ""}
      <button class="x" id="hideInstall" aria-label="Dismiss">×</button>
    </div>`;
}

addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; showInstall("button"); });
if(isIos) setTimeout(()=>{ if(!deferred) showInstall("ios"); }, 900);

document.addEventListener("click", async e=>{
  if(e.target.id === "hideInstall"){
    localStorage.setItem("mbh_install_hidden","1");
    $("installSlot").innerHTML = "";
  }
  if(e.target.id === "doInstall" && deferred){
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    $("installSlot").innerHTML = "";
  }
});

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
